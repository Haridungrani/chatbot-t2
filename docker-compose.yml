version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot_db1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  # Standalone GraphQL Server
  graphql:
    build:
      context: ./graphql-server
      dockerfile: Dockerfile
    container_name: chatbot_graphql
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chatbot_db1
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot_network
    restart: unless-stopped

  # FastAPI Backend with GraphQL (Commented out - running locally instead)
