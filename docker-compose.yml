  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatbot_db1
  #     SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
  #     ALGORITHM: HS256
  #     ACCESS_TOKEN_EXPIRE_MINUTES: 30
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - chatbot_network
  #   restart: unless-stopped

  # Next.js Frontend (Commented out - running locally instead)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: chatbot_frontend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   ports:
  #     - "3000:3000"
  #   volumes:
